<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf6ec;
    color: #3e3232;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 30px;
    font-weight: 700;
    color: #8b4513;
    margin-bottom: 8px;
  }
  .header p {

  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 560px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fffef9;
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none;
    color: #3e3232;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #e8ddcc;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(139,69,19,0.12);
  }
  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #8b4513;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .card-body {
    flex: 1;
    min-width: 0;
  }
  .card-body h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-body span {
    font-size: 13px;
    color: #a08870;
  }
  .card-arrow {
    color: #c4b090;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card.coming-soon {
    opacity: 0.55;
    cursor: default;
  }
  .card.coming-soon:hover {
    transform: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card.coming-soon .card-icon {
    background: #c4b090;
  }
  .card.coming-soon .card-body span {
    color: #b8a48a;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #8b4513;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border: 1px solid #e8ddcc;
    border-radius: 8px;
    background: #fffef9;
    margin-bottom: 24px;
    transition: all 0.15s;
  }
  .back-link:hover {
    background: #f5ede0;
    border-color: #c4956a;
    transform: translateX(-3px);
  }
  .footer {
    margin-top: 48px;
    font-size: 13px;
    color: #c4b090;
  }
</style>
