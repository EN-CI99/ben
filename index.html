<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>复习 · 习题集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f0eb;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 30px;
    font-weight: 700;
    color: #8b1a1a;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 15px;
    color: #888;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 560px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none;
    color: #333;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(139,26,26,0.1);
  }
  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #8b1a1a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .card-body {
    flex: 1;
    min-width: 0;
  }
  .card-body h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card-body span {
    font-size: 13px;
    color: #999;
  }
  .card-arrow {
    color: #ccc;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card.coming-soon {
    opacity: 0.6;
    cursor: default;
  }
  .card.coming-soon:hover {
    transform: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card.coming-soon .card-icon {
    background: #ccc;
  }
  .footer {
    margin-top: 48px;
    font-size: 13px;
    color: #bbb;
  }
</style>
</head>
<body>

  复习 · 习题集
